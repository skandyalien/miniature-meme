<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICD-11 Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Public+Sans:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <button class="menu-btn" id="menuBtn" type="button" aria-label="Show code list">☰ Codes</button>
  <div class="brand"><h1>ICD-11 Explorer</h1><span class="rel" id="rel">MMS</span></div>
  <div class="search">
    <input id="q" type="search" placeholder="Search code or text — e.g. 6A20, schizophrenia, panic, 6C40.2" autocomplete="off" spellcheck="false" aria-label="Search ICD-11">
    <kbd>/</kbd>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="fulltext"> Search descriptions too</label>
    <label><input type="checkbox" id="onlyCh6"> Chapter 06 only</label>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="panes">
  <nav class="rail" id="rail" aria-label="ICD-11 codes">
    <div class="rail-head"><span id="railTitle">All chapters</span><button type="button" id="collapseBtn">Collapse all</button></div>
    <div class="list" id="list"><div class="loading">Loading 37,000+ ICD-11 entries…</div></div>
  </nav>
  <div class="scrim" id="scrim" hidden></div>
  <main class="main" id="main"><div class="sheet" id="sheet"><div class="loading">Loading…</div></div></main>
</div>
<script src="data/index.js"></script>
<script src="app.js"></script>
</body>
</html>
